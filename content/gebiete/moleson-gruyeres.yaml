id: moleson-gruyeres
name: Moléson und Gruyères
beschreibung: Der Moléson (2002 m) ist der Aussichtsberg über Gruyères mit Standseilbahn und Pendelbahn ab Moléson-sur-Gruyères (Bus 263 ab Bulle). Aufstieg zu Fuß in drei Stunden, Klettersteig am Gipfelaufbau, Abstieg über Plan-Francey. Ab Offenburg in gut vier Stunden, ganzjährig.
