name: Disentis / Surselva
beschreibung: Klosterdorf am Oberalppass mit der Cavardirashütte auf der Tödi-Südseite, im Winter über die Seilbahn Caischavedra ein kurzer Skitourenzustieg. Fahrzeit über Chur oder Andermatt liegt an der Grenze des Budgets, lohnt sich für drei Tage.
