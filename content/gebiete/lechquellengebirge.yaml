name: Lechquellengebirge (Lech und Zug)
beschreibung: Vom Bahnhof Langen am Arlberg mit dem Bus nach Lech, dort im Sommer stündliche Wanderbusse zum Formarinsee und zum Spullersee. Freiburger Hütte unter der Roten Wand und Ravensburger Hütte sind in unter einer Stunde ab Busendhaltestelle erreichbar.
