beschreibung: Bergsee am Fuß der Kaiseregg (2185 m) in den Freiburger Voralpen, Bus 123 ab Fribourg bis Gypsera. Kaiseregg, Schafberg und die Breccaschlund-Runde sind Tagestouren, das Naturfreundehaus Aurore fünf Minuten von der Haltestelle. Im Winter Skitouren und Schneeschuhrouten.
