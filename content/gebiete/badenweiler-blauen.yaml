beschreibung: Der Blauen (1165 m) ist der südwestliche Eckpfeiler des Schwarzwalds mit Rundblick von Belchen bis Jura. Bus 650 ab Müllheim (Baden) bringt einen in einer Viertelstunde nach Badenweiler, von der Kurstadt führt der direkte Aufstieg in gut zwei Stunden zum Turm. Deutschlandticket reicht.
