beschreibung: Bus ab Visp durch das Saastal nach Saas-Grund, Saas-Almagell und Saas-Fee. Weissmieshütte und Britanniahütte sind per Bergbahn in unter einer Stunde erreichbar, die Almagellerhütte ist ein klassischer Talzustieg. Viertausender wie Weissmies und Allalinhorn als Hochtouren.
