id: jaun-charmey
name: Jaun, Gastlosen und Vanil Noir
beschreibung: Die Gastlosen sind die Kletter- und Wanderkette der Freiburger Voralpen, die Umrundung startet in Jaun (Bus 260 ab Bulle). Ab der Haltestelle Im Fang, Praz-Jean (Bus 260) führt der Zustieg zur Cabane des Marindes in 3:30 h unter dem Vanil Noir, dem höchsten Freiburger Gipfel. Ab Offenburg in viereinhalb Stunden, eher ein Wochenendziel.
