id: jaun-charmey
name: Jaun, Gastlosen und Vanil Noir
beschreibung: Die Gastlosen sind die Kletter- und Wanderkette der Freiburger Voralpen, die Umrundung startet in Jaun (Bus 260 ab Bulle). Von Charmey aus führt der Zustieg zur Cabane des Marindes unter dem Vanil Noir, dem höchsten Freiburger Gipfel. Ab Offenburg in viereinhalb Stunden, eher ein Wochenendziel.
