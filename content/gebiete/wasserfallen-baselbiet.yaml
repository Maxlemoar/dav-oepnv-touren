name: Wasserfallen und Passwang (Baselbieter Jura)
beschreibung: Gondelbahn ab Reigoldswil auf die Wasserfallen, Gratweg über Vogelberg und Hintere Egg zum Passwang mit Alpenblick vom Säntis bis zum Mont Blanc. Bus 70 ab Liestal, ab Offenburg in zweieinhalb Stunden das nächste Schweizer Ziel. Im Winter Schneeschuhrouten.
