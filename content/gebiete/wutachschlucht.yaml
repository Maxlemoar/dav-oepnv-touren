name: Wutachschlucht und Gauchachschlucht
beschreibung: Die tiefste Schlucht des Schwarzwalds mit Lotenbachklamm, Schattenmühle und Gauchachschlucht. Die Höllentalbahn hält in Löffingen und Bachheim, von dort in die Gauchachschlucht; die Wanderbusse 950/7258 verbinden Löffingen, Schattenmühle und Wutachmühle. Lange Talwanderungen ohne große Höhenmeter, im Winter teils gesperrt. Deutschlandticket reicht.
