id: murgtal
name: Murgtal (Gernsbach, Forbach, Baiersbronn)
beschreibung: Die Murgleiter führt in fünf Etappen von Gaggenau über Gernsbach und Forbach nach Baiersbronn, die Stadtbahn S8 hält an jeder Etappe. Teufelsmühle, Schwarzenbachtalsperre und Herrenwieser See sind Tagesziele ab Forbach, im Winter mit Schneeschuhen. Zwei Naturfreundehäuser in Hörden und Michelbach liegen direkt am Bahnhof. Deutschlandticket reicht.
