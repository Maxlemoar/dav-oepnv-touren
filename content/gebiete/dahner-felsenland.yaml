id: dahner-felsenland
name: Dahner Felsenland (Pfälzerwald)
beschreibung: Buntsandsteintürme, Felsenpfade und über 1000 Kletterrouten im südlichen Pfälzerwald. Bus 250/252 ab Hinterweidenthal (Bahnhof an der Strecke Landau–Pirmasens) nach Dahn, sonn- und feiertags von Mai bis Oktober fährt die Wieslauterbahn direkt. Dahner Felsenpfad und die Klettersteige am Hochstein sind Halbtagesrunden. Deutschlandticket reicht.
