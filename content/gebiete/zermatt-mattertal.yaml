id: zermatt-mattertal
name: Zermatt / Mattertal
beschreibung: Sechs SAC-Hütten ab Bahnhof, von Schönbiel und Rothorn bis zur Monte-Rosa-Hütte über die Gornergratbahn. Randa und Täsch sind die Zustiege für Dom-, Weisshorn- und Täschhütte. Fahrzeit knapp über fünf Stunden, für Wochenenden mit Hochtouren besser drei Tage.
haltestellen: [zermatt, taesch, randa]
sportarten: [wandern, hochtour, skitour, klettern]
saison: ganzjaehrig
