id: grimsel-haslital
name: Grimsel, Trift und Susten
beschreibung: Oberhasli ab Innertkirchen mit drei Pässen. Postauto über die Grimsel (Handegg, Räterichsboden, Hospiz) und den Susten (Steingletscher), Triftbahn im Gadmertal. Granitklettern, Hochtouren und mehrere SAC-Hütten; Busse nur etwa Juni bis Oktober.
