id: walensee-churfirsten-flumserberg
name: "Walensee: Churfirsten und Flumserberg"
beschreibung: Die sieben Churfirsten stehen 1800 Meter über dem Walensee, Walenstadt ist der Bahnhof für den Aufstieg auf den Leistchamm oder Paxmal. Gegenüber führen ab Unterterzen die Bahnen auf den Flumserberg, von dort Spitzmeilenhütte, Prodkamm und Skitouren. Direktzug Basel–Chur, ab Offenburg unter vier Stunden.
