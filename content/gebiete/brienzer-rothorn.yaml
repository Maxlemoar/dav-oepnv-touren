id: brienzer-rothorn
name: Brienzer Rothorn (Brienz, Sörenberg, Brünig)
beschreibung: "Das Brienzer Rothorn (2350 m) verbindet Berner Oberland und Entlebuch: Dampfzahnradbahn ab Brienz, Gondel ab Sörenberg, Gratweg über Eiseesattel und Arnihaaggen bis zum Brünig. Das Naturfreundehaus Brünig liegt fünf Minuten vom Bahnhof Brünig-Hasliberg. Ab Offenburg über Luzern in knapp vier Stunden."
