id: albtrauf-bad-urach
name: Albtrauf bei Bad Urach und Reutlingen
beschreibung: Uracher Wasserfall, Ruine Hohenurach und die Traufkanten der Schwäbischen Alb, Bahnhof Bad Urach an der Ermstalbahn ab Metzingen. Auf der Reutlinger Seite liegt das Wanderheim Eninger Weide des Albvereins an der Bushaltestelle für Achalm und Roßberg. Über Stuttgart in gut drei Stunden erreichbar, Deutschlandticket reicht.
