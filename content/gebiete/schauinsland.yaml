beschreibung: Freiburgs Hausberg mit Schauinslandbahn ab Horben, Stadtbahn und Bus 21 bringen einen ab Freiburg Hauptbahnhof in einer halben Stunde zur Talstation. Aufstieg über das Bohrertal oder den Kohlerhau, oben Gipfelturm, Bergwerk und Abstieg nach Todtnau oder ins Münstertal. Im Winter Schneeschuhrouten am Gipfel. Deutschlandticket reicht.
