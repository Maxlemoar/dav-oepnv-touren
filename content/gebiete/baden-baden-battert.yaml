id: baden-baden-battert
name: Battert und Merkur (Baden-Baden)
beschreibung: Der Battert ist mit über 100 Routen im Porphyr das klassische Klettergebiet der Region, dazu Battertfelsen-Rundweg, Altes Schloss und der Merkur mit Standseilbahn. Ab Baden-Baden Bahnhof mit Bus 205/244 bis Ebersteinburg Wolfsschlucht, von dort 20 Minuten zum Einstieg. Deutschlandticket reicht.
