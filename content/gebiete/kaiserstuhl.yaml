name: Kaiserstuhl
beschreibung: Vulkanhügel zwischen Rhein und Schwarzwald mit Lösshohlwegen, Trockenrasen und Reben. Ihringen und Endingen liegen an der Kaiserstuhlbahn, der Neunlindenturm auf dem Totenkopf ist von beiden Bahnhöfen in gut zwei Stunden erreicht. Gut im Frühjahr und Herbst, wenn die Alpen noch oder schon Schnee haben; Deutschlandticket reicht.
