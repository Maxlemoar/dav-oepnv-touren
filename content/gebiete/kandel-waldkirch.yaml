id: kandel-waldkirch
name: Kandel ab Waldkirch
beschreibung: Der Kandel (1241 m) steigt direkt hinter dem Bahnhof Waldkirch aus dem Elztal auf, gut 950 Höhenmeter über Kandelfelsen und Kandelhöhenweg. Wer weiter will, geht über St. Peter nach Kirchzarten und fährt mit der Höllentalbahn zurück. Deutschlandticket reicht, Breisgau-S-Bahn ab Freiburg halbstündlich.
