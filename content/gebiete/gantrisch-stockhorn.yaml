id: gantrisch-stockhorn
name: Gantrisch, Stockhorn und Niesen
beschreibung: Die Gantrischkette zwischen Gurnigel und Simmental mit dem Stockhorn (2190 m) als Gratwanderung ab Bus Wasserscheide oder Gurnigel Berghaus. Erlenbach ist der Bahnhof für die Stockhornbahn, Mülenen der für den Niesen mit seiner Standseilbahn. Alles ab Offenburg in dreieinhalb Stunden, ideal für den ersten Voralpen-Tag der Saison.
