id: alpstein
name: Alpstein
beschreibung: Säntis, Ebenalp und Seealpsee ab Wasserauen, Fälensee und Hoher Kasten ab Brülisau, Säntis-Schwebebahn ab Schwägalp. Berggasthäuser wie Meglisalp, Äscher und Bollenwees ersetzen die Hütten, die Hundsteinhütte ist die einzige SAC-Hütte. Als Tagestour knapp, mit Übernachtung ein perfektes Wochenende.
